name: Update GitHub Stats

on:
  schedule:
    # Refresh daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate profile metrics
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Requires repo secret METRICS_TOKEN (classic PAT — no scopes needed for public stats)
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rakesh69
          template: classic
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update GitHub metrics [skip ci]"
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          config_timezone: Asia/Kolkata
          config_display: large

          base: header, activity, community, repositories
          base_indepth: yes

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_lines: yes

          plugin_followup: yes
          plugin_followup_sections: repositories

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Rakesh69
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
